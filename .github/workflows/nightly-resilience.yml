name: Nightly Resilience
on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heap:
    name: Heap-growth gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run test:heap

  chaos:
    name: Resilience chaos (fault injection)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run test:chaos

  k6-soak:
    name: k6 load/soak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Build CLI bundle
        env:
          JWT_SECRET: ci-build-secret-with-sufficient-length-for-validation
          OMNIROUTE_BUILD_BACKEND_ONLY: "1"
        run: npm run build:cli
      - name: Start OmniRoute (background)
        env:
          JWT_SECRET: ci-build-secret-with-sufficient-length-for-validation
          PORT: "20128"
        run: |
          node dist/server.js > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:20128/api/monitoring/health >/dev/null; then echo "server up"; break; fi
            sleep 2
          done
      - name: Install k6
        uses: grafana/setup-k6-action@v1
      - name: Run k6 soak
        run: k6 run tests/load/k6-soak.js
        env:
          BASE_URL: http://localhost:20128
          SOAK_DURATION: "3m"
          SOAK_VUS: "10"
      - name: Stop server
        if: always()
        run: kill "$(cat server.pid)" || true

  a11y:
    name: A11y axe (nightly, freeze-and-alert)
    runs-on: ubuntu-latest
    # The Playwright webServer (`start` mode) builds Next via build-next-isolated.mjs and
    # boots the standalone server itself (waits on /api/monitoring/health, 15min webServer
    # timeout). Unlike the per-PR test-e2e job, this nightly job has no pre-built artifact,
    # so it self-builds — hence the generous job timeout. REQUIRE_AXE=1 makes the suite run
    # the real axe analysis (the 4 page tests are gated to nightly so per-PR e2e stays fast)
    # and makes the meta-test fail loudly if @axe-core/playwright ever goes missing.
    timeout-minutes: 30
    env:
      JWT_SECRET: ci-test-secret-with-sufficient-length-for-validation
      API_KEY_SECRET: ci-test-api-key-secret-long
      DISABLE_SQLITE_AUTO_BACKUP: "true"
      REQUIRE_AXE: "1"
      # Mirrors build.yml's proven build recipe (and quality.yml's swap step). This job is
      # the only nightly job that self-builds, and it was the only build path in the repo
      # running with neither swap nor a raised heap. --max-old-space-size bounds V8's JS
      # heap only, never Turbopack's native (Rust) allocation (#6409), so the swap is what
      # absorbs the native peak during "Collecting page data". Without both, the build was
      # SIGTERMed partway through page-data collection on 6/6 nights (Sep 22-27).
      OMNIROUTE_BUILD_MEMORY_MB: "12288"
      NODE_OPTIONS: --max-old-space-size=12288
    steps:
      # Turbopack's native peak is not bounded by --max-old-space-size, so the hosted
      # runner needs swap headroom before the self-build starts. Mirrors build.yml.
      - name: Expand virtual memory (10 GB swap)
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          sudo fallocate -l 10G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=10240
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-chromium-${{ runner.os }}-
      - run: npx playwright install --with-deps chromium
      - name: Run axe a11y suite (self-building webServer)
        # Playwright buffers webServer stdout until the process exits, so when the
        # self-build died the log showed only "Process completed with exit code 143" with
        # no build output at all. DEBUG=pw:webserver streams it live, which is what
        # identified the failure as "Collecting page data using 3 workers" rather than
        # compilation. Keep it so any future failure is readable rather than opaque.
        env:
          DEBUG: pw:webserver
        run: npx playwright test tests/e2e/a11y.spec.ts
